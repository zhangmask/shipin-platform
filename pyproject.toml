[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipin-platform"
version = "0.1.0"
description = "AI Video Generation Platform - Open-source tool integration"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.44.0",
    "openai-whisper>=20250625",
    "zhconv>=1.4.3",
    "moviepy>=2.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.27"]
gpu = ["torch>=2.0", "torchaudio>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
